<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
のさり勤怠 Ver.3.0
</title>


<link rel="stylesheet" href="style.css">


<link rel="manifest" href="manifest.json">


</head>


<body>


<header>

<h1>
のさり勤怠
</h1>


<div id="todayDisplay">

</div>


</header>





<main>


<!-- =========================
スタッフ打刻
========================= -->


<section class="card">


<h2>
出退勤
</h2>



<select id="staffSelect">

</select>



<div class="button-area">


<button id="clockInBtn">

出勤

</button>



<button id="clockOutBtn">

退勤

</button>


</div>



<div id="message">

</div>


</section>







<!-- =========================
本日の勤務
========================= -->


<section class="card">


<h2>

本日の勤務

</h2>


<div id="todayList">


</div>


</section>







<!-- =========================
管理者
========================= -->


<section class="card">


<button id="adminBtn">

管理者画面

</button>




<div id="adminArea"
style="display:none;">



<h2>

管理者メニュー

</h2>





<!-- スタッフ管理 -->


<h3>

スタッフ管理

</h3>



<ul id="staffList">

</ul>





<div>

<input

id="newStaffName"

type="text"

placeholder="スタッフ名">


<input id="newStaffName" type="text">

<button id="addStaffBtn">
スタッフ追加
</button>

</div>






<!-- 勤怠履歴 -->


<h3>

勤怠履歴

</h3>


<div id="attendanceList">

</div>






<!-- データ管理 -->


<h3>

データ管理

</h3>



<button id="csvBtn">

CSV出力

</button>



<button id="backupBtn">

バックアップ

</button>




<input

id="restoreFile"

type="file"

accept=".json">


<button id="restoreBtn">

復元

</button>





<button id="clearBtn">

勤怠全削除

</button>






<!-- 設定 -->


<h3>

設定

</h3>



<button id="changePinBtn">

PIN変更

</button>




</div>


</section>



</main>






<script src="app.js"></script>


</body>

</html>
