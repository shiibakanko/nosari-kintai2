<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>のさり勤怠 Ver.3.0</title>

    <meta name="theme-color" content="#4CAF50">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     ヘッダー
===================================================== -->

<header>

    <h1>のさり勤怠</h1>

    <div id="currentDate"></div>

    <div id="currentTime"></div>

</header>

<!-- =====================================================
     メイン
===================================================== -->

<main>

    <!-- スタッフ選択 -->

    <section class="card">

        <h2>スタッフ</h2>

        <select id="staffSelect">
            <option value="">スタッフを選択してください</option>
        </select>

    </section>

    <!-- 出勤退勤 -->

    <section class="card buttonArea">

        <button id="clockInBtn">

            出勤

        </button>

        <button id="clockOutBtn">

            退勤

        </button>

    </section>

    <!-- メッセージ -->

    <section class="card">

        <div id="message">

            お疲れ様です！

        </div>

    </section>

</main>

<!-- =====================================================
     フッター
===================================================== -->

<footer>

    <button id="adminOpen">

        ⚙ 管理者

    </button>

</footer>

<!-- =====================================================
     管理者ログイン
===================================================== -->

<div id="adminModal" class="modal hidden">

    <div class="modalContent">

        <h2>管理者ログイン</h2>

        <input
            type="password"
            id="pinInput"
            maxlength="8"
            placeholder="PINコード">

        <div class="modalButtons">

            <button id="pinLogin">

                ログイン

            </button>

            <button id="pinCancel">

                キャンセル

            </button>

        </div>

    </div>

</div>

<!-- =====================================================
     管理画面
===================================================== -->

<div id="adminPanel" class="hidden">

    <h2>

        管理メニュー

    </h2>

    <!-- データ管理 -->

    <section class="card">

        <h3>

            データ管理

        </h3>

        <button id="csvBtn">

            CSV出力

        </button>

        <button id="staffBtn">

            スタッフ管理

        </button>

        <button id="backupBtn">

            バックアップ

        </button>

        <button id="restoreBtn">

            復元

        </button>

    </section>

    <!-- 設定 -->

    <section class="card">

        <h3>

            システム設定

        </h3>

        <button id="settingBtn">

            営業時間

        </button>

        <button id="changePinBtn">

            PIN変更

        </button>

        <button id="resetPinBtn">

            PIN再設定

        </button>

    </section>

    <button id="closeAdmin">

        戻る

    </button>

</div>

<!-- =====================================================
     JavaScript
===================================================== -->

<script src="app.js"></script>

</body>
</html>
